version: '3.8'

services:
  unified-backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ../ancient_script_extraction:/app/ancient_script_extraction
      - ../analysis_tools:/app/analysis_tools
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - unified-backend
