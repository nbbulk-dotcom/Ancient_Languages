name: CI - Test Build Deploy

on:
  push:
    branches: [ main, devin/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install backend deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r fullstack_translator/ancient_translator_backend/requirements.txt

      - name: Run Python unit tests
        run: |
          . .venv/bin/activate
          pytest -q || (cat ./fullstack_translator/ancient_translator_backend/tests/*.log || true ; exit 1)

      - name: Build frontend
        run: |
          cd fullstack_translator/ancient_translator_frontend
          npm ci
          npm run build

      - name: Docker build (smoke)
        run: |
          docker build -t ancient-languages-ci:latest fullstack_translator/ancient_translator_backend

      - name: Integration smoke test
        run: |
          docker run -d --rm -p 8020:8000 --name ancient-ci ancient-languages-ci:latest
          sleep 5
          curl -sS -f http://localhost:8020/health
        timeout-minutes: 10

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -sL https://fly.io/install.sh | sh
          export PATH=$PATH:$HOME/.fly/bin
          flyctl deploy --config fullstack_translator/ancient_translator_backend/fly.toml --remote-only
