output_dir: ./output
rate_limits:
  default: 1.0
  sigla.phis.me: 1.0
  cdli.ucla.edu: 1.0
expected_counts:
  LinearA: 87
  KhitanLargeScript: 500
  ProtoElamite: 1000
  IndusValleyScript: 400
sources:
  LinearA:
    - name: SigLA
      api: https://sigla.phis.me/api/
    - name: GORILA
      url: https://utexas.edu/research/pasp/publications/
  KhitanLargeScript:
    - name: Unicode
      block: U+18B00-U+18CFF
    - name: BabelStone
      url: https://babelstone.co.uk/Khitan/
  ProtoElamite:
    - name: CDLI
      api: https://cdli.ucla.edu/
  IndusValleyScript:
    - name: Harappa
      url: https://www.harappa.com/script
modifiers:
  minoan_ceremonial_amplification: 1.26
logging:
  file: extraction_log.txt
ocr:
  prefer: easyocr
  easyocr_languages: ['en']
docker:
  enable_tesseract: true
